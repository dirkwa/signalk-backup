name: Publish Package

# Tag glob is intentionally tight ('v[0-9]*.[0-9]*.[0-9]*') so stray
# tags like `vendor-fix` or `vnext` don't trigger a publish. Prerelease
# suffixes (-beta./-rc.) still match because the glob looks at the
# leading digits only; the publish step routes them to npm's `beta`
# dist-tag instead of `latest`.

# A real release's tag and GitHub Release are both created by release-please,
# which then dispatches this workflow on the tag — a tag pushed with
# GITHUB_TOKEN starts no workflow, and npm's trusted publishing is bound to
# this filename, so the dispatch is how publishing happens.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  # release-please creates the GitHub Release for a real version, so only a
  # hand-pushed pre-release tag needs one made here; running for every tag
  # would collide with the Release that already exists.
  release:
    if: ${{ contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The trigger glob already filters out non-semver-shaped tags, but
      # it accepts loose forms like `v01.0.0` (leading zeros) or
      # `v1.0.0.0` (four segments). Reject those before doing anything
      # publishable so a malformed tag never produces a Release.
      - name: Validate tag is semver
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} is not a valid semver vX.Y.Z[-prerelease][+build]"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Always true: the job's own condition already limits it to tags carrying
      # a pre-release part, so an identifier other than -beta./-rc. cannot be
      # published here as a full release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # No `needs: release`: that job is pre-release-only now, and a real
    # release must still publish when it is skipped.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      # The release job above validates the tag too, but it only runs for a
      # pre-release now — so a malformed stable tag would reach npm unchecked
      # without this.
      - name: Validate tag is semver
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} is not a valid semver vX.Y.Z[-prerelease][+build]"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        env:
          REF: ${{ github.ref }}
        # Any tag carrying a semver pre-release part goes to the `beta`
        # dist-tag, not just -beta./-rc. Enumerating identifiers would send an
        # unlisted one such as -alpha.1 to `latest`, where a plain npm install
        # would hand it to every user as the current release.
        run: |
          if [[ "${REF#refs/tags/}" =~ ^v[^+-]+- ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
