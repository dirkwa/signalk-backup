version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Pin to the
      # lowest supported runtime (Node 22 per package.json engines) so
      # types reflect what's actually available on every supported version.
      # Allow updates within the v22.x line; ignore v23+.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # From 1.18 the plugin auto-shares react-dom/client with import: false,
      # which breaks embedded loading on SignalK admin UIs that only provide
      # react and react-dom (see vite.config.ts). Stay on the tested 1.15.x
      # line until the admin UI provides the sub-path or the plugin allows
      # opting out.
      - dependency-name: "@module-federation/vite"
        versions: [">=1.16.0"]
      # vite 8.1.x (rolldown 1.1.x) makes @module-federation/vite 1.15.x
      # additionally register react-dom/client in usedShared with a throwing
      # import: false getter. Hold the 8.0.x line so the built share map stays
      # identical to the known-good 0.9.3 output (see vite.config.ts).
      - dependency-name: "vite"
        versions: [">=8.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
