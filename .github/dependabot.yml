version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Pin to the
      # lowest supported runtime (Node 22 per package.json engines) so
      # types reflect what's actually available on every supported version.
      # Allow updates within the v22.x line; ignore v23+.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # @module-federation/vite and vite are deliberately NOT pinned here any
      # more: scripts/check-federation-shares.mjs fails `npm run build` (and
      # so CI and publish) if a bump makes the remote's share map drift from
      # what the Signal K admin UI provides, and `npm run test:e2e` loads the
      # panel in a real admin UI. That is the check a version pin was
      # standing in for (#94, #108).

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
